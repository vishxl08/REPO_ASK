[project]
name = "repomind"
version = "0.1.0"
description = "Chat with any codebase in natural language — hybrid RAG over your repo."
requires-python = ">=3.11"

[project.scripts]
repomind = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "cli", "pipeline", "timing", "paths"]
packages = ["db", "ingestion", "retrieval", "generation", "eval"]
